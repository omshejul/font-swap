<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SwapFont</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <main class="panel">
    <header class="panel-header">
      <h1><img src="icons/icon-32.png" width="22" height="22" alt="">SwapFont</h1>
      <button type="button" id="undo" class="button button-small" title="Undo all" aria-label="Undo all" hidden>
        <span>Undo all</span>
        <svg class="undo-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
      </button>
      <a id="feedback" class="icon-button" href="mailto:chromewebstore@omshejul.com" title="Send feedback" aria-label="Send feedback">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/></svg>
      </a>
      <button type="button" id="mode-toggle" class="icon-button" title="Float on page" aria-label="Float on page">
        <svg class="mode-float" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 8h18"/><rect x="10" y="12" width="8" height="6" rx="1"/></svg>
        <svg class="mode-dock" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18m-8-9h5m-2-2 2 2-2 2"/></svg>
      </button>
    </header>

    <div class="panel-content">
    <section id="view-loading" class="state-view">
      <span class="spinner" aria-hidden="true"></span>
      <p>Connecting</p>
    </section>

    <section id="view-error" class="state-view" hidden>
      <p id="connect-error" role="alert"></p>
      <button type="button" id="retry" class="button">Retry</button>
    </section>

    <div id="view-main" class="main" hidden>
      <ul id="pairs" class="pairs" aria-label="Font swaps" hidden></ul>

      <div id="steps-home" hidden>
        <div id="steps" class="steps" hidden>
          <div class="font-choice" role="group" aria-label="Replacement font">
            <label class="step-search" for="search">
              <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
              <span class="visually-hidden">Search Google Fonts</span>
              <input id="search" class="step-input" type="search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="results" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search Google Fonts" disabled>
            </label>
            <button type="button" id="pick-dest" class="link-button" hidden>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 9-8.414 8.414A2 2 0 0 0 3 18.828v1.344a2 2 0 0 1-.586 1.414A2 2 0 0 1 3.828 21h1.344a2 2 0 0 0 1.414-.586L15 12"/><path d="m18 9 .4.4a1 1 0 1 1-3 3l-3.8-3.8a1 1 0 1 1 3-3l.4.4 3.4-3.4a1 1 0 1 1 3 3z"/><path d="m2 22 .414-.414"/></svg>
              Pick from page
            </button>
            <div id="results" class="results" role="listbox" aria-label="Fonts" hidden></div>
          </div>
        </div>
      </div>

      <button type="button" id="another" class="another" hidden><span aria-hidden="true">＋</span> Pick another font</button>

      <label id="remember-row" class="remember-site" hidden><input id="remember-site" type="checkbox"> <span>Remember for this site</span></label>

      <div id="messages-home">
        <p id="note" class="note" role="status"></p>
        <p id="error" class="error" role="alert" hidden></p>
      </div>
      <section id="tag-filter" class="tag-filter" popover="auto" role="dialog" aria-labelledby="tag-filter-title">
        <div class="tag-filter-header">
          <h2 id="tag-filter-title">Apply to tags</h2>
          <button id="all-tags" type="button">All tags</button>
        </div>
        <label class="tag-search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <span class="visually-hidden">Find tags</span>
          <input id="tag-search" type="search" placeholder="Find tags..." autocomplete="off" spellcheck="false">
        </label>
        <div id="tag-options" class="tag-options" role="group" aria-label="HTML tags"></div>
        <p id="tag-error" class="error" role="alert" hidden></p>
      </section>
    </div>
    </div>
    <footer class="panel-footer">
      <a class="browse-fonts" href="https://fonts.google.com/" target="_blank" rel="noopener noreferrer" aria-label="Browse Google Fonts, opens in a new tab">
        <img class="google-fonts-logo" src="icons/google-fonts.png" width="22" height="22" alt="">
        <span>Browse Google Fonts</span>
        <svg class="external-link" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6m0-6L10 14"/><path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></svg>
      </a>
    </footer>
  </main>
  <script src="sidepanel.js" type="module"></script>
</body>
</html>
