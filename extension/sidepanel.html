<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SwapFont</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <main class="panel">
    <header class="panel-header">
      <h1><img src="icons/icon-32.png" width="24" height="24" alt="">SwapFont</h1>
      <button type="button" id="undo" class="button button-small" hidden>Undo all</button>
      <button type="button" id="mode-toggle" class="icon-button" title="Float on page" aria-label="Float on page">
        <svg class="mode-float" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 8h18"/><rect x="10" y="12" width="8" height="6" rx="1"/></svg>
        <svg class="mode-dock" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18m-8-9h5m-2-2 2 2-2 2"/></svg>
      </button>
    </header>

    <section id="view-loading" class="state-view">
      <span class="spinner" aria-hidden="true"></span>
      <p>Connecting</p>
    </section>

    <section id="view-error" class="state-view" hidden>
      <p id="connect-error" role="alert"></p>
      <button type="button" id="retry" class="button">Retry</button>
    </section>

    <div id="view-main" class="main" hidden>
      <div id="picking-home" hidden>
        <div id="picking" class="notice" hidden>
          <p>Click text on the page</p>
          <button type="button" id="cancel" class="button button-small">Cancel</button>
        </div>
      </div>

      <ul id="pairs" class="pairs" aria-label="Font swaps" hidden></ul>

      <div id="steps-home" hidden>
        <div id="steps" class="steps" hidden>
          <div class="font-choice" role="group" aria-label="Replacement font">
            <label class="step-search" for="search">
              <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
              <span class="visually-hidden">Search Google Fonts</span>
              <input id="search" class="step-input" type="search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="results" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search Google Fonts" disabled>
            </label>
            <button type="button" id="pick-dest" class="link-button" hidden>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 9-8.414 8.414A2 2 0 0 0 3 18.828v1.344a2 2 0 0 1-.586 1.414A2 2 0 0 1 3.828 21h1.344a2 2 0 0 0 1.414-.586L15 12"/><path d="m18 9 .4.4a1 1 0 1 1-3 3l-3.8-3.8a1 1 0 1 1 3-3l.4.4 3.4-3.4a1 1 0 1 1 3 3z"/><path d="m2 22 .414-.414"/></svg>
              Pick from page
            </button>
            <div id="results" class="results" role="listbox" aria-label="Fonts" hidden></div>
          </div>
        </div>
      </div>

      <button type="button" id="another" class="another" hidden><span aria-hidden="true">＋</span> Pick another font</button>

      <div id="messages-home">
        <p id="note" class="note" role="status"></p>
        <p id="error" class="error" role="alert" hidden></p>
      </div>
    </div>
  </main>
  <script src="sidepanel.js" type="module"></script>
</body>
</html>
