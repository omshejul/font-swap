<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Font Swap</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <main class="panel">
    <header class="panel-header">
      <h1><img src="icons/icon-32.png" width="24" height="24" alt="">Font Swap</h1>
      <button type="button" id="undo" class="button button-small" hidden>Undo all</button>
    </header>

    <section id="view-loading" class="state-view">
      <span class="spinner" aria-hidden="true"></span>
      <p>Connecting</p>
    </section>

    <section id="view-error" class="state-view" hidden>
      <p id="connect-error" role="alert"></p>
      <button type="button" id="retry" class="button">Retry</button>
    </section>

    <div id="view-main" class="main" hidden>
      <div id="picking" class="notice" hidden>
        <p>Click text on the page</p>
        <button type="button" id="cancel" class="button button-small">Cancel</button>
      </div>

      <ul id="pairs" class="pairs" aria-label="Swapped fonts" hidden></ul>

      <div id="steps" class="steps">
        <button type="button" id="pick-source" class="step" aria-pressed="false">
          <span class="step-number" aria-hidden="true">1</span>
          <span id="source-name" class="step-label">Pick font</span>
        </button>
        <label class="step step-search" for="search">
          <span class="step-number" aria-hidden="true">2</span>
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <span class="visually-hidden">Search Google Fonts</span>
          <input id="search" class="step-input" type="search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="results" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search Google Fonts" disabled>
        </label>
        <div id="results" class="results" role="listbox" aria-label="Fonts" hidden></div>
        <button type="button" id="pick-dest" class="link-button" hidden>Pick from page</button>
      </div>

      <button type="button" id="another" class="button" hidden>+ Another font</button>

      <p id="note" class="note" role="status"></p>
      <p id="error" class="error" role="alert" hidden></p>
      <details id="warnings" class="warnings" hidden>
        <summary>Notes</summary>
        <ul id="warning-list"></ul>
      </details>
    </div>
  </main>
  <script src="sidepanel.js" type="module"></script>
</body>
</html>
