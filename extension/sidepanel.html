<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SwapFont</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <main class="panel">
    <header class="panel-header">
      <h1><img src="icons/icon-32.png" width="22" height="22" alt="">SwapFont</h1>
      <button type="button" id="undo" class="button button-small" title="Undo all" aria-label="Undo all" hidden>
        <span>Undo all</span>
        <svg class="undo-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
      </button>
      <a id="feedback" class="icon-button" href="mailto:chromewebstore@omshejul.com" title="Send feedback" aria-label="Send feedback">
        <svg width="18" height="18" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="M480-360q17 0 28.5-11.5T520-400q0-17-11.5-28.5T480-440q-17 0-28.5 11.5T440-400q0 17 11.5 28.5T480-360Zm-40-160h80v-240h-80v240ZM80-80v-720q0-33 23.5-56.5T160-880h640q33 0 56.5 23.5T880-800v480q0 33-23.5 56.5T800-240H240L80-80Zm126-240h594v-480H160v525l46-45Zm-46 0v-480 480Z"/></svg>
      </a>
      <button type="button" id="mode-toggle" class="icon-button" title="Float on page" aria-label="Float on page">
        <svg class="mode-float" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 8h18"/><rect x="10" y="12" width="8" height="6" rx="1"/></svg>
        <svg class="mode-dock" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18m-8-9h5m-2-2 2 2-2 2"/></svg>
      </button>
    </header>

    <div class="panel-content">
    <section id="view-loading" class="state-view">
      <span class="spinner" aria-hidden="true"></span>
      <p>Connecting</p>
    </section>

    <section id="view-error" class="state-view" hidden>
      <figure id="access-guide" class="access-guide" aria-hidden="true" hidden>
        <figcaption>Top of your browser</figcaption>
        <svg class="access-toolbar" width="328" height="44" viewBox="0 0 328 44" fill="none" focusable="false">
          <rect class="access-toolbar-frame" x=".5" y=".5" width="327" height="43" rx="7"/>
          <rect class="access-address" x="12" y="10" width="232" height="24" rx="12"/>
          <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="23" y="20" width="10" height="8" rx="2"/>
            <path d="M25 20v-3a3 3 0 0 1 6 0v3m-3 4v1"/>
            <path transform="translate(257 11) scale(.8)" d="M15.39 4.39a1 1 0 0 0 1.68-.474 2.5 2.5 0 1 1 3.014 3.015 1 1 0 0 0-.474 1.68l1.683 1.682a2.414 2.414 0 0 1 0 3.414L19.61 15.39a1 1 0 0 1-1.68-.474 2.5 2.5 0 1 0-3.014 3.015 1 1 0 0 1 .474 1.68l-1.683 1.682a2.414 2.414 0 0 1-3.414 0L8.61 19.61a1 1 0 0 0-1.68.474 2.5 2.5 0 1 1-3.014-3.015 1 1 0 0 0 .474-1.68l-1.683-1.682a2.414 2.414 0 0 1 0-3.414L4.39 8.61a1 1 0 0 1 1.68.474 2.5 2.5 0 1 0 3.014-3.015 1 1 0 0 1-.474-1.68l1.683-1.682a2.414 2.414 0 0 1 3.414 0z"/>
          </g>
          <text class="access-example" x="40" y="26" fill="currentColor" font-size="12">example.org</text>
          <rect class="access-icon-halo" x="288" y="7" width="30" height="30" rx="7"/>
          <svg class="access-logo" x="292" y="11" width="22" height="22" viewBox="0 0 512 512" focusable="false">
            <rect width="512" height="512" rx="128"/>
            <path fill="#ffffff" stroke="#333333" stroke-width="5.29167" stroke-linecap="round" stroke-linejoin="round" paint-order="stroke fill markers" d="m 258.35918,429.23106 q -30.78165,0 -54.8228,-9.43672 -24.04114,-9.66139 -38.42089,-27.63608 -14.37975,-17.97469 -16.62659,-43.36393 h 65.15825 q 1.79746,15.50317 13.03164,24.26583 11.23418,8.76266 30.55697,8.76266 18.42406,0 28.7595,-6.96519 10.56013,-6.9652 10.56013,-17.97469 0,-9.43671 -8.08861,-15.27849 -7.86392,-5.84177 -22.46836,-8.53797 l -41.56646,-8.08861 q -34.60128,-6.74051 -52.57596,-24.26583 -17.97469,-17.52532 -17.97469,-44.93672 0,-22.46836 12.13291,-39.31963 12.3576,-16.85127 34.82596,-26.0633 22.69304,-9.21203 53.69938,-9.21203 30.78165,0 53.69938,9.88608 22.91773,9.6614 35.72469,27.63608 13.03165,17.97469 13.7057,42.68989 h -61.33862 q -0.22468,-14.37975 -11.23418,-23.81646 -11.0095,-9.43671 -28.7595,-9.43671 -17.07595,0 -26.73735,7.41455 -9.66139,7.18988 -9.66139,17.75001 0,9.21203 7.63924,15.0538 7.63924,5.84177 21.12026,8.76266 l 44.93672,8.76266 q 35.94937,6.96519 52.80064,22.91773 17.07595,15.72785 17.07595,42.01583 0,23.59178 -13.48101,41.34178 -13.25633,17.52532 -37.07279,27.4114 -23.59178,9.6614 -54.59812,9.6614 z"/>
          </svg>
          <rect class="access-icon" x="292" y="11" width="22" height="22" rx="5.5"/>
        </svg>
        <div class="access-point"><span>Click this</span><svg class="access-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div>
      </figure>
      <h2 id="connect-error-title"></h2>
      <p id="connect-error" role="alert"></p>
      <p id="access-hint" class="access-hint" hidden>Can't see the S? Click the puzzle piece, then <strong>SwapFont</strong>.</p>
      <button type="button" id="retry" class="button">Retry</button>
    </section>

    <div id="view-main" class="main" hidden>
      <ul id="pairs" class="pairs" aria-label="Font swaps" hidden></ul>

      <div id="steps-home" hidden>
        <div id="steps" class="steps" hidden>
          <div class="font-choice" role="group" aria-label="Replacement font">
            <label class="step-search" for="search">
              <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
              <span class="visually-hidden">Search Google Fonts</span>
              <input id="search" class="step-input" type="search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="results" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search Google Fonts" disabled>
            </label>
            <button type="button" id="pick-dest" class="link-button" hidden>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 9-8.414 8.414A2 2 0 0 0 3 18.828v1.344a2 2 0 0 1-.586 1.414A2 2 0 0 1 3.828 21h1.344a2 2 0 0 0 1.414-.586L15 12"/><path d="m18 9 .4.4a1 1 0 1 1-3 3l-3.8-3.8a1 1 0 1 1 3-3l.4.4 3.4-3.4a1 1 0 1 1 3 3z"/><path d="m2 22 .414-.414"/></svg>
              Pick from page
            </button>
            <div id="results" class="results" role="listbox" aria-label="Fonts" hidden></div>
          </div>
        </div>
      </div>

      <button type="button" id="another" class="another" hidden><span aria-hidden="true">＋</span> Pick another font</button>

      <label id="remember-row" class="remember-site" hidden><input id="remember-site" type="checkbox"> <span>Remember for this site</span></label>
      <section id="remember-permission" class="permission-callout" role="status" hidden>
        <div class="permission-heading">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/></svg>
          <span>Not remembered for this site</span>
        </div>
        <p id="remember-description">Your swaps still work here. Nothing was saved.</p>
        <button id="remember-retry" class="permission-retry" type="button">Try again</button>
      </section>

      <div id="messages-home">
        <p id="note" class="note" role="status"></p>
        <p id="error" class="error" role="alert" hidden></p>
      </div>
      <section id="tag-filter" class="tag-filter" popover="auto" role="dialog" aria-labelledby="tag-filter-title">
        <div class="tag-filter-header">
          <h2 id="tag-filter-title">Apply to tags</h2>
          <button id="pick-tag" type="button" class="icon-button" title="Pick a tag from the page" aria-label="Pick a tag from the page"></button>
          <button id="all-tags" type="button">All tags</button>
        </div>
        <label class="tag-search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <span class="visually-hidden">Find tags</span>
          <input id="tag-search" type="search" placeholder="Find tags..." autocomplete="off" spellcheck="false">
        </label>
        <div id="tag-options" class="tag-options" role="group" aria-label="HTML tags"></div>
        <p id="tag-error" class="error" role="alert" hidden></p>
      </section>
    </div>
    </div>
    <footer class="panel-footer">
      <a class="browse-fonts" href="https://fonts.google.com/" target="_blank" rel="noopener noreferrer" aria-label="Browse Google Fonts, opens in a new tab">
        <img class="google-fonts-logo" src="icons/google-fonts.png" width="22" height="22" alt="">
        <span>Browse Google Fonts</span>
        <svg class="external-link" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6m0-6L10 14"/><path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></svg>
      </a>
    </footer>
  </main>
  <script src="sidepanel.js" type="module"></script>
</body>
</html>
